$('overview').addEventListener('click',e=>{if(e.target===$('overview'))closeOverview()});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowRight','PageDown',' ','ArrowDown'].includes(e.key)){if(e.key===' '&&document.activeElement?.tagName==='BUTTON')return;e.preventDefault();if(!$('overview').classList.contains('open'))go(index+1)}else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();if(!$('overview').classList.contains('open'))go(index-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(slides.length-1)}else if(e.key.toLowerCase()==='g'&&!e.repeat){openOverview()}else if(e.key.toLowerCase()==='f'&&!e.repeat){toggleFullscreen()}else if(e.key==='Escape'){closeOverview();closeInfo();if(fullFallback){document.body.classList.remove('full');fullFallback=false}}});
$('frame').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});$('frame').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>55)go(index+(dx<0?1:-1));startX=null},{passive:true});
$('stage').addEventListener('wheel',e=>{if($('infoPanel').classList.contains('open')||$('overview').classList.contains('open'))return;if(Math.abs(e.deltaY)<18||lock)return;lock=true;go(index+(e.deltaY>0?1:-1));setTimeout(()=>lock=false,650)},{passive:true});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m)go(Number(m[1])-1,true)});const m=location.hash.match(/^#slide-(\d+)$/);go(m?Number(m[1])-1:0,true);if(matchMedia('(max-width:840px)').matches)$('sidebar').classList.add('collapsed');$('menuBtn').setAttribute('aria-expanded',String(!$('sidebar').classList.contains('collapsed')));
</script>
</body>
</html>
